[package]
name = "oplire-reset"
version = "3.0.0"
edition = "2024"
description = "OpenCode V2 Responses proxy with encrypted reasoning fix"
authors = ["Berke Oruc"]
license = "MIT"
repository = "https://github.com/berkeoruc/oplire"
homepage = "https://github.com/berkeoruc/oplire"

[[bin]]
name = "oplire"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full", "process"] }
axum = { version = "0.8", features = ["json", "query"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "blocking"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
